name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate:
    name: Validate (${{ matrix.brand }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        brand:
          - brightshore
          - essex
          - cornerstone
    env:
      APP_BRAND: ${{ matrix.brand }}
      EXPO_PUBLIC_APP_BRAND: ${{ matrix.brand }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Resolve Expo config
        run: npx expo config --json > /tmp/expo-config.json
